name: E-Commerce CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      # 1. Download repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Python for FastAPI backend
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 3. Install backend dependencies
      - name: Install backend dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Check backend Python syntax
      - name: Check backend syntax
        run: |
          python -m py_compile backend/main.py

      # 5. Setup Node.js for React frontend
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # 6. Install frontend dependencies
      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      # 7. Build React frontend
      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

      # 8. Create CI environment file
      - name: Create CI environment
        run: |
          cat > .env <<EOF
          POSTGRES_DB=ecommerce_db
          POSTGRES_USER=ecommerce_user
          POSTGRES_PASSWORD=ci_test_password
          DB_HOST=postgres
          DB_PORT=5432
          REDIS_HOST=redis
          REDIS_PORT=6379
          EOF

      # 9. Validate Docker Compose configuration
      - name: Validate Docker Compose
        run: docker compose config --quiet

      # 10. Build application Docker images
      - name: Build Docker images
        run: |
          docker compose build backend-blue backend-green frontend
